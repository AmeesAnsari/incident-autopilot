[project]
name = "incident-autopilot"
version = "0.1.0"
description = "Monitoring alerts in, grouped self-resolving incidents out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx2>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["incident_autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
